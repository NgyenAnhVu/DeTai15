<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Nộp bài & Chấm điểm Tự động - Đề tài 15</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 750px; margin: 30px auto; padding: 20px; background: #f4f6f9; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #1a73e8; }
        label { font-weight: 600; display: block; margin-top: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 14px; font-size: 14px; }
        button:hover { background: #1557b0; }
        button.secondary { background: #34a853; }
        button.secondary:hover { background: #2d8e47; }
        .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
        .online { background: #e6f4ea; color: #137333; }
        .offline { background: #fce8e6; color: #c5221f; }
        .notify-box { border-left: 4px solid #1a73e8; background: #f8f9fa; padding: 12px; margin-top: 10px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; }
        th { background: #f1f3f4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Hệ thống Nộp bài & Chấm tự động</h2>
        <div>Trạng thái Realtime: <span id="connStatus" class="status offline">Đang kết nối...</span></div>
    </div>

    <div class="card">
        <h3>1. Nộp bài tập</h3>
        <label>Mã Sinh viên (Student ID):</label>
        <input type="number" id="studentId" value="1" min="1">

        <label>Chọn Bài tập (tải từ GET /assignments):</label>
        <select id="assignmentSelect">
            <option value="1">Đang tải danh sách bài tập...</option>
        </select>

        <label>Nội dung bài làm:</label>
        <textarea id="content" rows="4" placeholder="Nhập nội dung bài làm của bạn (viết dài > 50 ký tự để đạt điểm cao)..."></textarea>

        <button onclick="submitAssignment()">Nộp Bài Ngay</button>
        <p id="submitMsg" style="color: #137333; font-weight: 600; margin-bottom: 0;"></p>
    </div>

    <div class="card">
        <h3>2. Thông báo kết quả chấm Realtime (SignalR)</h3>
        <div id="notifications">
            <p style="color: #666; font-style: italic;">Chưa có thông báo mới. Hãy nộp bài và chờ vài giây...</p>
        </div>
    </div>

    <div class="card">
        <h3>3. Lịch sử bài đã nộp (GET /students/{id}/submissions)</h3>
        <button class="secondary" onclick="loadHistory()">Tải lại lịch sử bài nộp</button>
        <div id="historyArea"></div>
    </div>

    <script>
        const API_BASE = "http://localhost:5158";
        const HUB_URL = "http://localhost:5200/notificationHub";

        // 1. Kết nối SignalR nhận thông báo Realtime
        const connection = new signalR.HubConnectionBuilder()
            .withUrl(HUB_URL)
            .withAutomaticReconnect()
            .build();

        connection.on("ReceiveGradingResult", (data) => {
            const container = document.getElementById("notifications");
            if (container.querySelector("p")) container.innerHTML = "";

            const item = document.createElement("div");
            item.className = "notify-box";
            item.innerHTML = `
                <strong>Bài nộp #${data.submissionId} đã chấm xong!</strong><br>
                Điểm số: <strong style="color:#d93025; font-size:16px;">${data.score}/10</strong> | Trạng thái: <b>${data.status}</b><br>
                Nhận xét: <i>${data.feedback}</i>
            `;
            container.prepend(item);
            loadHistory(); // Tự động cập nhật bảng lịch sử
        });

        connection.start()
            .then(() => {
                const el = document.getElementById("connStatus");
                el.textContent = "Đã kết nối SignalR (Online)";
                el.className = "status online";
            })
            .catch(err => console.error("Lỗi SignalR:", err));

        // 2. Tải danh sách bài tập (GET /assignments)
        async function loadAssignments() {
            try {
                const res = await fetch(`${API_BASE}/assignments`);
                const list = await res.json();
                const select = document.getElementById("assignmentSelect");
                select.innerHTML = list.map(a => `<option value="${a.id}">#${a.id} - ${a.title}</option>`).join("");
            } catch (e) {
                console.error("Không tải được danh sách bài tập:", e);
            }
        }

        // 3. Gửi bài nộp (POST /assignments/{id}/submissions)
        async function submitAssignment() {
            const studentId = parseInt(document.getElementById("studentId").value);
            const assignmentId = document.getElementById("assignmentSelect").value;
            const content = document.getElementById("content").value.trim();

            if (!content) return alert("Vui lòng nhập nội dung bài làm!");

            const res = await fetch(`${API_BASE}/assignments/${assignmentId}/submissions`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ studentId, content })
            });

            if (res.ok) {
                const result = await res.json();
                document.getElementById("submitMsg").textContent = `Đã nộp thành công (Mã bài #${result.id})! Đang chờ Worker chấm...`;
                document.getElementById("content").value = "";
                loadHistory();
            }
        }

        // 4. Tra cứu lịch sử bài nộp của sinh viên (GET /students/{studentId}/submissions)
        async function loadHistory() {
            const studentId = document.getElementById("studentId").value;
            const res = await fetch(`${API_BASE}/students/${studentId}/submissions`);
            if (!res.ok) return;
            const data = await res.json();

            if (data.length === 0) {
                document.getElementById("historyArea").innerHTML = "<p>Sinh viên này chưa có bài nộp nào.</p>";
                return;
            }

            let html = `<table>
                <tr><th>Mã bài</th><th>Bài tập</th><th>Trạng thái</th><th>Điểm</th><th>Nhận xét</th></tr>`;
            for (const s of data) {
                html += `<tr>
                    <td>#${s.id}</td>
                    <td>${s.assignmentId}</td>
                    <td><b>${s.status}</b></td>
                    <td>${s.score !== null ? s.score + "/10" : "-"}</td>
                    <td>${s.feedback ?? "Đang chờ chấm..."}</td>
                </tr>`;
            }
            html += "</table>";
            document.getElementById("historyArea").innerHTML = html;
        }

        // Khởi chạy dữ liệu ban đầu khi mở trang
        loadAssignments();
        loadHistory();
    </script>
</body>
</html>
